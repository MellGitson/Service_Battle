services:
  front:
    image: ${REGISTRY}/sb-front:${TAG}
    build:
      context: services/front
    restart: unless-stopped
    ports:
      - "3000:5000"
    environment:
      TABLEAU_URL: ${TABLEAU_URL}
      GROUPE: ${GROUPE}
      COULEUR: ${COULEUR}
      SERVICE: front
      VERSION: ${TAG}
      PAVILLON_FICHIER: ${PAVILLON_FICHIER}
      URL_INTERNE: http://front:5000
      URL_API: http://api:5000
    volumes:
      - pavillon:/data
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/sante')"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    image: ${REGISTRY}/sb-api:${TAG}
    build:
      context: services/api
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      TABLEAU_URL: ${TABLEAU_URL}
      GROUPE: ${GROUPE}
      COULEUR: ${COULEUR}
      SERVICE: api
      VERSION: ${TAG}
      PAVILLON_FICHIER: ${PAVILLON_FICHIER}
      URL_INTERNE: http://api:5000
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pavillon:/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/sante')"]
      interval: 10s
      timeout: 3s
      retries: 3

  annexe:
    image: ${REGISTRY}/sb-annexe:${TAG}
    build:
      context: services/annexe
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      TABLEAU_URL: ${TABLEAU_URL}
      GROUPE: ${GROUPE}
      COULEUR: ${COULEUR}
      SERVICE: annexe
      VERSION: ${TAG}
      PAVILLON_FICHIER: ${PAVILLON_FICHIER}
      URL_INTERNE: http://annexe:5000
    volumes:
      - pavillon:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/sante')"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pavillon:
  db-data:
